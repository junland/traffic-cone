name: E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    env:
      DPA_USERNAME: dataplane
      DPA_PASSWORD: dataplanepass
      HAPROXY_DOCKER_IMAGE: haproxytech/haproxy:alpine-s6-3.5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Install mkpasswd (From whois package)
        run: sudo apt-get update && sudo apt-get install -y whois

      - name: Build CLI binary
        run: go build -o bin/traffic-cone ./cmd/traffic-cone

      - name: Pull HAProxy image
        run: docker pull "${HAPROXY_DOCKER_IMAGE}"

      - name: Run traffic-cone and validate Docker events
        run: |
          set -euo pipefail
          export DPA_PASSWORD_HASH="$(mkpasswd -m sha-256 "${DPA_PASSWORD}")"
          # Give Data Plane API up to 20s to initialize with HAProxy before considering startup failed.
          MAX_RETRIES=20

          cleanup() {
            set +e
            if [[ -n "${TRAFFIC_CONE_PID_FILE:-}" ]] && [[ -f "${TRAFFIC_CONE_PID_FILE}" ]]; then
              TRAFFIC_CONE_PID="$(cat "${TRAFFIC_CONE_PID_FILE}")"
              if kill -0 "${TRAFFIC_CONE_PID}" >/dev/null 2>&1; then
                kill "${TRAFFIC_CONE_PID}" >/dev/null 2>&1 || true
                wait "${TRAFFIC_CONE_PID}" >/dev/null 2>&1 || true
              fi
            fi
            docker rm -f e2e-haproxy >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name e2e-haproxy \
            -e DPA_USERNAME="${DPA_USERNAME}" \
            -e DPA_PASSWORD_HASH="${DPA_PASSWORD_HASH}" \
            -p 5555:5555 \
            -v "$PWD/.github/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" \
            "${HAPROXY_DOCKER_IMAGE}"

          sleep 5

          CURL_OPTS="--no-progress-meter --retry 5 --retry-delay 2 --retry-connrefused"
          TRAFFIC_CONE_PID_FILE="${PWD}/traffic-cone.pid"

          # Make sure we can reach the Data Plane API before proceeding
          ready=false
          for ((i=1; i<=MAX_RETRIES; i++)); do
            if curl ${CURL_OPTS} -H "Content-Type: application/json" -X GET http://127.0.0.1:5555/v2/ >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "${ready}" != "true" ]]; then
            echo "Validation failed: Data Plane API not reachable after ${MAX_RETRIES}s"
            docker logs e2e-haproxy || true
            exit 1
          fi

          # Start traffic-cone in the background
          HAPROXY_DATA_PLANE_API_PASSWORD="${DPA_PASSWORD}" \
          ./bin/traffic-cone \
            -pid-file "${TRAFFIC_CONE_PID_FILE}" \
            -haproxy-data-plane-api-address http://127.0.0.1:5555 \
            -haproxy-data-plane-api-username "${DPA_USERNAME}" \
            > e2e.log 2>&1 &
          
          # Wait a moment for the daemon to start and subscribe to events
          sleep 2
          
          # Launch a few Docker containers
          docker run --name e2e-test-1 --rm alpine echo "Running container 1"
          docker run --name e2e-test-2 --rm alpine echo "Running container 2"
          
          # Wait for events to be processed
          sleep 2
          
          # Terminate traffic-cone
          kill $(cat "${TRAFFIC_CONE_PID_FILE}") || true

          # Display the output for debugging
          echo "traffic-cone output:"
          cat e2e.log
          
          # Validate that it captured the events for both containers
          if ! grep -q "e2e-test-1" e2e.log; then
            echo "Validation failed: e2e-test-1 not found in traffic-cone output"
            exit 1
          fi
          
          if ! grep -q "e2e-test-2" e2e.log; then
            echo "Validation failed: e2e-test-2 not found in traffic-cone output"
            exit 1
          fi
          
          echo "Validation successful!"
