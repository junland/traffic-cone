name: Docker Web Server Example

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  webserver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start NGINX
        run: |
          docker run -d \
            --name webserver \
            -p 8080:80 \
            nginx:alpine

      - name: Wait for server
        run: |
          for i in {1..10}; do
            if curl -fs http://localhost:8080 >/dev/null; then
              echo "Server is up!"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          docker logs webserver
          exit 1

      - name: Test server
        run: |
          curl http://localhost:8080

      - name: Show container logs
        if: always()
        run: docker logs webserver

      - name: Stop container
        if: always()
        run: docker rm -f webserver