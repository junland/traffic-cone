global
  daemon
  pidfile /var/run/haproxy.pid
  stats socket /var/run/haproxy-runtime-api.sock level admin expose-fd listeners
  default-path config
  maxconn 10000
  chroot / # Ignore the warning about running in a chroot in a container. We are running in a chroot in a container.
  user root # Ignore the warning about running as root in a container. We are running as root in a container.

defaults
  mode http
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  
frontend fe
  bind *:8080
  default_backend be

backend be
  server s1 127.0.0.1:8080
